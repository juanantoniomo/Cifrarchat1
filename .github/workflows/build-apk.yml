name: Build CifraChat Android + iOS

on:
  push:
    branches: [main]
    paths:
      - "CifraChat_MVP_mobile_build.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Flutter app from ZIP
        run: |
          unzip -oq CifraChat_MVP_mobile_build.zip -d source
          test -f source/CifraChat_MVP/client/pubspec.yaml

      - name: Generate Android project
        working-directory: source/CifraChat_MVP/client
        run: flutter create . --platforms=android --project-name cifra_chat --org com.cifrachat

      - name: Allow network connections
        working-directory: source/CifraChat_MVP/client
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          if "android.permission.INTERNET" not in text:
              text = text.replace(marker, marker + '\n    <uses-permission android:name="android.permission.INTERNET"/>')
          if "usesCleartextTraffic=" not in text:
              text = text.replace("<application", '<application\n        android:usesCleartextTraffic="true"')
          manifest.write_text(text)
          PY

      - name: Resolve Flutter packages
        working-directory: source/CifraChat_MVP/client
        run: flutter pub get

      - name: Build release APK
        working-directory: source/CifraChat_MVP/client
        run: flutter build apk --release

      - name: Name APK
        run: cp source/CifraChat_MVP/client/build/app/outputs/flutter-apk/app-release.apk CifraChat.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: CifraChat-APK
          path: CifraChat.apk
          if-no-files-found: error
          retention-days: 30

  build-ios:
    name: Build iOS (unsigned)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Flutter app from ZIP
        run: |
          unzip -oq CifraChat_MVP_mobile_build.zip -d source
          test -f source/CifraChat_MVP/client/pubspec.yaml

      - name: Generate iOS project
        working-directory: source/CifraChat_MVP/client
        run: flutter create . --platforms=ios --project-name cifra_chat --org com.cifrachat

      - name: Resolve Flutter packages
        working-directory: source/CifraChat_MVP/client
        run: flutter pub get

      - name: Build unsigned iOS archive
        working-directory: source/CifraChat_MVP/client
        run: flutter build ipa --release --no-codesign

      - name: Package unsigned Xcode archive
        run: tar -czf CifraChat-iOS-unsigned.xcarchive.tar.gz -C source/CifraChat_MVP/client/build/ios/archive Runner.xcarchive

      - name: Upload unsigned iOS build
        uses: actions/upload-artifact@v6
        with:
          name: CifraChat-iOS-unsigned
          path: CifraChat-iOS-unsigned.xcarchive.tar.gz
          if-no-files-found: error
          retention-days: 30
